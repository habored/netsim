# Ce fichier doit être placé dans .github/workflows/ à la racine du projet

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm install
    - run: npm run build
    # - run: npm test # Décommente cette ligne si tu ajoutes un script de test dans ton package.json
